[package]
name = "alert-registry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1.3.2", features = ["derive"] }
alert-registry = { path = "..", features = ["testutils"] }
soroban-sdk = { version = "25.3.0", features = ["testutils"] }

[[bin]]
name = "validate_rule"
path = "fuzz_targets/validate_rule.rs"
test = false
doc = false

[[bin]]
name = "register_alert"
path = "fuzz_targets/register_alert.rs"
test = false
doc = false

[workspace]
[workspace]
